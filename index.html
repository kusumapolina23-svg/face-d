<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Emotion Detector</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script defer src="script.js"></script>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Face Detection</h1>
        <p class="subtitle">Motion &amp; Emotion Recognition System</p>
        <div class="camera-box">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
        </div>
        <div id="status">Loading AI models...</div>
        <div class="emotion-card">
            <div id="emoji">😐</div>
            <h2 id="emotion">Neutral</h2>
            <p id="confidence">Confidence: 0%</p>
        </div>
        <div class="buttons">
            <button id="startBtn">📷 Start Camera</button>
            <button id="stopBtn">⛔ Stop Camera</button>
        </div>
        <div class="info">
            <p>😊 Happy &nbsp; | &nbsp; 😢 Sad &nbsp; | &nbsp; 😐 Neutral</p>
        </div>
    </div>
</body>
</html>
